<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Metaverse · Admin</title>
<link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/static/css/metaverse.css">
<style>html,body{overflow:auto!important}.pre{white-space:pre-wrap;word-break:break-word}</style>
</head>
<body>
<div class="container py-3">
  <div class="d-flex align-items-center gap-3 mb-3">
    <h4 class="brand m-0">AI Metaverse · Admin</h4><a href="/" class="btn btn-sm btn-outline-info">← World</a>
    <span class="chip" id="ollama">Ollama…</span>
    <div class="ms-auto input-group input-group-sm" style="max-width:380px"><span class="input-group-text">Admin token</span>
      <input id="token" type="password" class="form-control" placeholder="instance/admin_token"></div>
  </div>
  <div id="alert" class="alert alert-danger py-1" hidden></div>
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#dir">Directory</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#edit" id="editTab">Create / Edit</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#mon">Monitor</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#evt">Events</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#cfg">Settings</a></li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="dir"><table class="table table-sm align-middle"><thead><tr>
      <th>Name</th><th>Role</th><th>Location / activity</th><th>Model</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>

    <div class="tab-pane fade" id="edit"><form id="form" class="row g-2" autocomplete="off">
      <input type="hidden" id="f_id">
      <div class="col-md-4"><label class="form-label">Agent name</label><input id="f_name" class="form-control" maxlength="40" required></div>
      <div class="col-md-5"><label class="form-label">Role</label><input id="f_role" class="form-control" maxlength="80" required></div>
      <div class="col-md-3"><label class="form-label">Starting location</label><select id="f_home" class="form-select"></select></div>
      <div class="col-md-6"><label class="form-label">Ollama model <small class="text-secondary">(blank = default)</small></label><select id="f_model" class="form-select"></select></div>
      <div class="col-md-3 pt-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="f_auto" checked><label class="form-check-label">Autonomous behavior</label></div></div>
      <div class="col-md-3 pt-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="f_active" checked><label class="form-check-label">Active</label></div></div>
      <div class="col-12"><label class="form-label">Personality</label><textarea id="f_pers" class="form-control" rows="2" maxlength="1000"></textarea></div>
      <div class="col-12"><label class="form-label">System prompt</label><textarea id="f_prompt" class="form-control" rows="4" maxlength="4000"></textarea></div>
      <div class="col-12"><label class="form-label">Goals (one per line)</label><textarea id="f_goals" class="form-control" rows="2"></textarea></div>
      <div class="col-12"><button class="btn btn-info">Save agent</button> <button type="button" class="btn btn-outline-light" id="newBtn">New</button></div>
    </form></div>

    <div class="tab-pane fade" id="mon">
      <div class="d-flex gap-2 mb-2"><select id="monSel" class="form-select form-select-sm w-auto"></select><button class="btn btn-sm btn-outline-info" id="monRefresh">Refresh</button></div>
      <div class="row g-3"><div class="col-md-6"><div class="glass p-3 small" id="monInfo"></div>
        <form id="taskForm" class="mt-3 glass p-3"><label class="form-label small">Assign task</label>
          <textarea id="t_desc" class="form-control form-control-sm mb-2" rows="2" maxlength="1000" required></textarea>
          <div class="input-group input-group-sm"><span class="input-group-text">Delegate to</span><select id="t_to" class="form-select"></select><button class="btn btn-info">Assign</button></div></form></div>
        <div class="col-md-6"><div class="glass p-3 small"><b>Recent interactions</b><div id="monMsgs" class="mt-2"></div></div>
          <div class="glass p-3 small mt-3"><b>Long-term memory</b><div id="monMem" class="mt-2"></div></div></div></div>
    </div>
    <div class="tab-pane fade" id="evt"><div id="evList" class="small"></div></div>
    <div class="tab-pane fade" id="cfg"><div class="col-md-6"><label class="form-label">Default Ollama model</label><select id="c_model" class="form-select mb-2"></select>
      <label class="form-label">Ollama URL</label><input id="c_url" class="form-control mb-2"><button class="btn btn-info" id="cSave">Save</button></div></div>
  </div>
</div>
<script src="/static/vendor/jquery.min.js"></script>
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/js/admin.js"></script>
</body></html>
